plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aethernova.controller'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aethernova.controller'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
}

// ZXing/AppCompat bring legacy split Kotlin JDK artifacts alongside the
// unified Kotlin stdlib. Exclude the obsolete split artifacts to avoid
// duplicate classes during Android packaging.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
